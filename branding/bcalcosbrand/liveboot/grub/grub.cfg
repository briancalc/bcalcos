if loadfont $prefix/font.pf2 ; then
  set gfxmode=1920x1080
  insmod efi_gop
  insmod efi_uga
  insmod video_bochs
  insmod video_cirrus
  insmod gfxterm
  insmod jpeg
  insmod png
  set theme=$prefix/theme.txt
  terminal_output gfxterm
fi

background_image /boot/grub/splash.png
set menu_color_normal=white/black
set menu_color_highlight=dark-gray/white
set timeout=15


menuentry "BcalcOS Linux (US English)" {
    set gfxpayload=keep
    linux   /live/vmlinuz boot=live   username=isouser    
    initrd  /live/initrd.img
}

