<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">

<!--
  local.conf
  v1.0

  System font preferences:
    sans-serif = Inter
    serif      = DejaVu Serif

  The standard monospace family is left unchanged.

  Specialized fonts below are hidden from font selectors.
-->

<fontconfig>

  <!-- =====================================================
       System-wide default fonts
       ===================================================== -->

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>DejaVu Serif</family>
    </prefer>
  </alias>


  <!-- =====================================================
       Hide specialized fonts from font selectors
       ===================================================== -->

  <selectfont>

    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>Classic Console</string>
        </patelt>
      </pattern>
    </rejectfont>

    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>gallant12x22</string>
        </patelt>
      </pattern>
    </rejectfont>


    <!-- MathJax fonts -->

    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>MathJax_Caligraphic</string>
        </patelt>
      </pattern>
    </rejectfont>

    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>MathJax_Fraktur</string>
        </patelt>
      </pattern>
    </rejectfont>

    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>MathJax_Main</string>
        </patelt>
      </pattern>
    </rejectfont>

    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>MathJax_Math</string>
        </patelt>
      </pattern>
    </rejectfont>

    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>MathJax_SansSerif</string>
        </patelt>
      </pattern>
    </rejectfont>

    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>MathJax_Script</string>
        </patelt>
      </pattern>
    </rejectfont>

    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>MathJax_Size1</string>
        </patelt>
      </pattern>
    </rejectfont>

    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>MathJax_Size2</string>
        </patelt>
      </pattern>
    </rejectfont>

    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>MathJax_Size3</string>
        </patelt>
      </pattern>
    </rejectfont>

    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>MathJax_Size4</string>
        </patelt>
      </pattern>
    </rejectfont>

    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>MathJax_Typewriter</string>
        </patelt>
      </pattern>
    </rejectfont>

    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>MathJax_Vector</string>
        </patelt>
      </pattern>
    </rejectfont>

    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>MathJax_Vector-Bold</string>
        </patelt>
      </pattern>
    </rejectfont>

    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>MathJax_WinChrome</string>
        </patelt>
      </pattern>
    </rejectfont>

    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>MathJax_WinIE6</string>
        </patelt>
      </pattern>
    </rejectfont>


    <!-- Other specialized fonts -->

    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>OCR A</string>
        </patelt>
      </pattern>
    </rejectfont>

    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>Special Elite</string>
        </patelt>
      </pattern>
    </rejectfont>

    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>Symbola</string>
        </patelt>
      </pattern>
    </rejectfont>

    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>Lato</string>
        </patelt>
      </pattern>
    </rejectfont>

    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>Noto Sans Mono</string>
        </patelt>
      </pattern>
    </rejectfont>

    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>Nimbus Mono PS</string>
        </patelt>
      </pattern>
    </rejectfont>

    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>MathJax_AMS</string>
        </patelt>
      </pattern>
    </rejectfont>

    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>D050000L</string>
        </patelt>
      </pattern>
    </rejectfont>

  </selectfont>

</fontconfig>
